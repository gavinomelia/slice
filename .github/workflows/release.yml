name: Release

# Publishing is driven by a tag, so what ships is always a commit that exists
# in history rather than whatever happened to be on a laptop.
#
# There is no npm token: npm trusts this workflow directly, via trusted
# publishing (`npm trust github`). That needs `id-token: write`, which is why it
# is requested below — it is also what puts a provenance attestation on the
# published package, letting anyone verify the tarball was built from this repo.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm test

      # A tag that disagrees with package.json publishes the wrong version
      # under the right name, and npm will not let you take it back.
      - name: the tag matches package.json
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged="$(node -p "require('./package.json').version")"
          if [ "$tagged" != "$packaged" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $packaged" >&2
            exit 1
          fi

      - name: the version is not on npm yet
        id: unpublished
        run: |
          if npm view "$(node -p "require('./package.json').name")@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "::notice::${GITHUB_REF_NAME#v} is already on npm, so there is nothing to publish"
          else
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.unpublished.outputs.yes == 'true'
        run: npm publish --provenance
